services:
  backend:
    build: ./backend
    container_name: it-support-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=mi-secreto-super-seguro-para-jwt-cambiame
      - ENCRYPTION_KEY=clave-de-32-bytes-para-cifrado
      - BACKUP_ENCRYPTION_KEY=clave-para-backups-cambiar
      - FRONTEND_URL=http://localhost
    volumes:
      - ./backend/data:/app/data
      - ./backend/backups:/app/backups
    networks:
      - it-network

  frontend:
    build: ./frontend
    container_name: it-support-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - it-network

networks:
  it-network:
    driver: bridge